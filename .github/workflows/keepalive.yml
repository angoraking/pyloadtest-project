# comprehensive github action yml reference: https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions
#
# Keepalive: GitHub disables scheduled workflows in a repo with no activity for 60 days.
# Once a week, write a random MD5 to chore.txt and push a commit to main.

---
name: Keepalive

on:
  schedule:
    - cron: "0 13 * * 1" # Every Monday 13:00 UTC = 08:00 EST (UTC-5); cron is always UTC, so 09:00 during EDT
  workflow_dispatch: # Allows you to manually trigger the workflow from the GitHub UI

# The default GITHUB_TOKEN needs write access to push the commit
permissions:
  contents: write

jobs:
  keepalive:
    name: "Commit chore.txt"
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v7" # https://github.com/marketplace/actions/checkout
        with:
          ref: main
      - name: "Write random MD5 to chore.txt"
        shell: bash
        run: |
          head -c 32 /dev/urandom | md5sum | cut -d " " -f 1 > chore.txt
          cat chore.txt
      - name: "Commit and push"
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chore.txt
          git commit -m "chore"
          git push origin HEAD:main
